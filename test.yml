name: Manual_Update
on:
  push:
  workflow_dispatch:

jobs:
  run_robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install Firebase
        run: pip install firebase-admin
      - name: Run
        run: python bot.py
